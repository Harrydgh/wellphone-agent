[project]
name = "wellphone-agent"
version = "0.1.0"
description = "A non-intrusive Android agent running on a secondary virtual display"
requires-python = ">=3.11"
dependencies = [
    "av>=14",
    "numpy>=1.26",
    "openai>=3.19,<4",
    "Pillow>=10",
]

[project.scripts]
wellphone = "wellphone_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
